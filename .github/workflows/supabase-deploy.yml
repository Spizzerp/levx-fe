name: supabase-deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ghczicioyzrbvtvdshcc
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to match the version used locally. Bump in a dedicated PR
          # so a Supabase CLI release can't break the pipeline silently.
          version: 2.75.0

      - name: Link project
        # Pass --password explicitly rather than relying on the CLI picking
        # up SUPABASE_DB_PASSWORD from env — deterministic + obvious in logs.
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push

      - name: Deploy verify-wallet edge function
        # --no-verify-jwt: the /nonce endpoint is pre-authentication (clients
        # need a nonce before they have a JWT). The function does its own
        # wallet-signature auth.
        run: supabase functions deploy verify-wallet --no-verify-jwt

      - name: Deploy request-test-usdc edge function
        # --no-verify-jwt: the function verifies the verify-wallet JWT itself
        # (HS256 against EDGE_JWT_SECRET). Letting Supabase's gateway also
        # verify would require the caller to send a separate Supabase JWT
        # we don't issue.
        #
        # Required Edge secrets (set once via `supabase secrets set …`):
        #   FAUCET_AUTHORITY_SECRET   base58 keypair, mints the collateral mint
        #   FAUCET_USDC_MINT          collateral mint pubkey
        #   FAUCET_RPC_URL            Solana RPC endpoint
        #   FAUCET_AMOUNT_BASE        amount in base units (e.g. 1000000000)
        #   EDGE_JWT_SECRET           HS256 secret matching verify-wallet
        run: supabase functions deploy request-test-usdc --no-verify-jwt
