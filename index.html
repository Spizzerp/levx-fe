<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark')
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/logo_color.png" />
    <link rel="apple-touch-icon" href="/logo_color.png" />

    <!-- Primary meta -->
    <title>LevX — Predict the path, not the outcome</title>
    <meta
      name="description"
      content="LevX is a DeFi prediction market where you wager on the shape of price paths, not just the destination. Live scoring, AI + human predictions, no order book."
    />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LevX" />
    <meta property="og:url" content="https://levx.trade/" />
    <meta property="og:title" content="LevX — Predict the path, not the outcome" />
    <meta
      property="og:description"
      content="LevX is a DeFi prediction market where you wager on the shape of price paths, not just the destination. Live scoring, AI + human predictions, no order book."
    />
    <meta property="og:image" content="https://levx.trade/logo_color.png" />
    <meta property="og:image:width" content="810" />
    <meta property="og:image:height" content="810" />
    <meta property="og:image:alt" content="LevX logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LevXtrade" />
    <meta name="twitter:creator" content="@LevXtrade" />
    <meta name="twitter:title" content="LevX — Predict the path, not the outcome" />
    <meta
      name="twitter:description"
      content="LevX is a DeFi prediction market where you wager on the shape of price paths, not just the destination."
    />
    <meta name="twitter:image" content="https://levx.trade/logo_color.png" />
    <meta name="twitter:image:alt" content="LevX logo" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Doto:wght@400..900&family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
